[pytest]
python_files = test_*.py
markers =
    parquet_data: tests related to parquet data validation
    smoke: smoke tests for basic functionality
    facility_name_min_time_spent_per_visit_date: tests for specific dataset
    facility_type_avg_time_spent_per_visit_date: tests for specific dataset
    patient_sum_treatment_cost_per_facility_type: tests for specific dataset
addopts = --strict-markers --verbose